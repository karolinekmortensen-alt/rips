// Label banks — 10 steps each. probLabel/consLabel picks by relative position within scale.
const PROB_BANK = ['Svært liten','Liten','Lav','Under middels','Moderat','Over middels','Stor','Høy','Svært stor','Nesten sikkert'];
const CONS_BANK = ['Ubetydelig','Liten','Lav','Under middels','Moderat','Over middels','Alvorlig','Kritisk','Svært alvorlig','Katastrofalt'];
const probLabel = (p, scale) => scale <= 1 ? PROB_BANK[9] : PROB_BANK[Math.round((p - 1) / (scale - 1) * (PROB_BANK.length - 1))];
const consLabel = (c, scale) => scale <= 1 ? CONS_BANK[9] : CONS_BANK[Math.round((c - 1) / (scale - 1) * (CONS_BANK.length - 1))];
const INITIAL_TAGS = ['IT-sikkerhet','Operasjonell','Finansiell','Compliance','HR','Prosjekt','Strategisk'];
const SEV_LABEL   = { low: 'Lav', medium: 'Moderat', high: 'Høy', critical: 'Kritisk' };

// Alvor beregnes proporsjonalt: score / maxScore med fire soner
const getSev = (p, c, scale = 5) => {
  const ratio = (p * c) / (scale * scale);
  if (ratio <= 0.16) return 'low';
  if (ratio <= 0.36) return 'medium';
  if (ratio <= 0.64) return 'high';
  return 'critical';
};

const SEV_BG_PRINT = { low: '#DDE7D5', medium: '#F5E5C3', high: '#F3D9DD', critical: '#E4A5AE' };
const SEV_FG_PRINT = { low: '#1A3320', medium: '#6B420A', high: '#6B0F20', critical: '#4A0A14' };
const SEV_PILL = {

  medium:   { bg: '#F5E5C3', fg: '#7A4E0F' },
  high:     { bg: '#F3D9DD', fg: '#7A1226' },

const formatDate = (s) => {
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(s))
    return new Date(s + 'T00:00:00').toLocaleDateString('nb-NO', { day:'numeric', month:'short' });
  return s; // legacy "DD.MM" strings shown as-is
};

function Icon({ name, size = 16, color }) {
  const p = {
    width: size, height: size, viewBox:'0 0 24 24',
    fill:'none', stroke: color || 'currentColor',
    strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round',
    style:{ display:'block', flexShrink:0 },
  };
  switch (name) {
    case 'grid':    return <svg {...p}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>;
    case 'folder':  return <svg {...p}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>;
    case 'plus':    return <svg {...p}><path d="M12 5v14M5 12h14"/></svg>;
    case 'x':       return <svg {...p}><path d="M18 6 6 18M6 6l12 12"/></svg>;
    case 'back':    return <svg {...p}><path d="m15 18-6-6 6-6"/></svg>;
    case 'forward': return <svg {...p}><path d="m9 18 6-6-6-6"/></svg>;
    case 'search':  return <svg {...p}><path d="M21 21l-4.3-4.3"/><circle cx="11" cy="11" r="7"/></svg>;
    case 'bell':    return <svg {...p}><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>;
    case 'check':   return <svg {...p} strokeWidth={2.5}><path d="M5 12l5 5L20 7"/></svg>;
    case 'logout':  return <svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>;
    case 'trash':   return <svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>;
    case 'edit':    return <svg {...p}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>;
    case 'user':    return <svg {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    case 'printer': return <svg {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>;
    default:        return null;
  }
}

/* ═══════════════════════════════════════════════════════════════
   TAG INPUT
═══════════════════════════════════════════════════════════════ */

function TagInput({ selected, onChange, available, onCreateTag, onDeleteTag }) {
  const [query,  setQuery]  = useState('');
  const [open,   setOpen]   = useState(false);
  const inputRef = React.useRef(null);

  const filtered  = available.filter(t => t.toLowerCase().includes(query.toLowerCase()) && !selected.includes(t));
  const canCreate = query.trim() && !available.some(t => t.toLowerCase() === query.trim().toLowerCase());

  const addTag = (tag) => {
    if (!selected.includes(tag)) onChange([...selected, tag]);
    setQuery('');
    inputRef.current?.focus();
  };
  const removeTag = (tag) => onChange(selected.filter(t => t !== tag));

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && canCreate) {
      e.preventDefault();
      const t = query.trim();
      onCreateTag(t);
      addTag(t);
    } else if (e.key === 'Backspace' && !query && selected.length > 0) {
      removeTag(selected[selected.length - 1]);
    } else if (e.key === 'Escape') {
      setOpen(false);
    }
  };

  return (
    <div className="tag-input-wrap">
      <div className="tag-input-field" onClick={() => { setOpen(true); inputRef.current?.focus(); }}>
        {selected.map(tag => (
          <span key={tag} className="tag-pill-sel">
            {tag}
            <button type="button" onMouseDown={e => { e.stopPropagation(); removeTag(tag); }} style={{ background:'none', border:'none', cursor:'pointer', color:'inherit', padding:0, display:'inline-flex', lineHeight:1 }}>
              <Icon name="x" size={10} />
            </button>
          </span>
        ))}
        <input
          ref={inputRef}
          value={query}
          onChange={e => { setQuery(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)}
          onBlur={() => setTimeout(() => setOpen(false), 160)}
          onKeyDown={handleKeyDown}
          placeholder={selected.length === 0 ? 'Velg eller opprett…' : ''}
          style={{ border:'none', outline:'none', background:'transparent', fontSize:13, minWidth:80, flex:1, padding:0 }}
        />
      </div>
      {open && (filtered.length > 0 || canCreate) && (
        <div className="tag-dropdown">
          {filtered.map(tag => (
            <div key={tag} className="tag-option" onMouseDown={() => addTag(tag)}>
              <span>{tag}</span>
              <button type="button" className="tag-option-del" onMouseDown={e => { e.stopPropagation(); onDeleteTag(tag); }} title="Slett tag">
                <Icon name="x" size={10} />
              </button>
            </div>
          ))}
          {canCreate && (
            <div className="tag-option tag-option-new" onMouseDown={() => { const t = query.trim(); onCreateTag(t); addTag(t); }}>
              + Opprett «{query.trim()}»
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   EIER-VELGER (kobler til registrerte brukere)
═══════════════════════════════════════════════════════════════ */

function OwnerSelect({ value, onChange, profiles = [], placeholder = 'Søk bruker eller skriv navn…' }) {
  const [query, setQuery]   = useState(value || '');
  const [open,  setOpen]    = useState(false);
  const inputRef            = useRef(null);

  // Sync display when value set externally
  useEffect(() => { setQuery(value || ''); }, [value]);

  const filtered = profiles.filter(p =>
    (p.full_name || '').toLowerCase().includes(query.toLowerCase()) ||
    (p.email     || '').toLowerCase().includes(query.toLowerCase())
  );

  const initials = (n) => (n || '?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

  const select = (name) => { onChange(name); setQuery(name); setOpen(false); };

  return (
    <div style={{ position:'relative' }}>
      <input
        ref={inputRef}
        className="rips-input"
        value={query}
        onChange={e => { setQuery(e.target.value); onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 160)}
        placeholder={placeholder}
      />
      {open && filtered.length > 0 && (
        <div className="tag-dropdown">
          {filtered.map(p => (
            <div key={p.id} className="tag-option" onMouseDown={() => select(p.full_name || p.email)}>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <span style={{ width:28, height:28, borderRadius:'50%', background:'var(--leaf)', color:'var(--leaf-skin)', display:'inline-flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:600, flexShrink:0 }}>
                  {initials(p.full_name || p.email)}
                </span>
                <div>
                  <div style={{ fontSize:13, fontWeight:500 }}>{p.full_name || p.email}</div>
                  {p.full_name && <div style={{ fontSize:11, color:'var(--ink-3)' }}>{p.email}</div>}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   PÅLOGGINGSSIDE
═══════════════════════════════════════════════════════════════ */

function LoginPage({ onBack }) {
  const [mode,     setMode]     = useState('login'); // 'login' | 'signup'
  const [email,    setEmail]    = useState('');
  const [name,     setName]     = useState('');
  const [password, setPassword] = useState('');
  const [error,    setError]    = useState('');
  const [info,     setInfo]     = useState('');
  const [loading,  setLoading]  = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError(''); setInfo(''); setLoading(true);
    try {
      if (mode === 'login') {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;
        // App component listens to onAuthStateChange — no need to call onSuccess
      } else {
        const { data, error } = await db.auth.signUp({
          email, password,
          options: { data: { full_name: name.trim() || email.split('@')[0] } },
        });
        if (error) throw error;
        if (data.user && !data.session) {
          setInfo('Sjekk e-posten din og klikk bekreftelseslenken, så kan du logge inn.');
        }
      }
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="login-page">
      <button className="rips-btn-ghost" style={{ position:'absolute', top:24, left:24, display:'flex', alignItems:'center', gap:6, fontSize:13 }} onClick={onBack}>
        <Icon name="back" size={14} /> Tilbake
      </button>
      <div className="login-card">
        <div style={{ textAlign:'center', marginBottom:28 }}><RipsLogo size={38} bg="var(--paper)" /></div>
        <h2 style={{ fontSize:22, fontWeight:500, letterSpacing:'-0.005em', margin:'0 0 6px', textAlign:'center' }}>
          {mode === 'login' ? 'Logg inn' : 'Opprett konto'}
        </h2>
        <p style={{ fontSize:13, color:'var(--ink-2)', margin:'0 0 24px', textAlign:'center' }}>
          {mode === 'login' ? 'Logg inn med e-post og passord.' : 'Opprett en ny Rips-konto.'}
        </p>
        {error && <div className="login-error" style={{ marginBottom:12 }}>{error}</div>}
        {info  && <div style={{ background:'var(--leaf-wash,#e4ede4)', color:'var(--leaf)', border:'1px solid var(--leaf)', borderRadius:4, padding:'10px 14px', fontSize:13, marginBottom:12 }}>{info}</div>}
        <form onSubmit={handleSubmit} style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {mode === 'signup' && (
            <div className="form-group">
              <label className="form-label">Navn</label>
              <input className="rips-input" type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Fornavn Etternavn" autoFocus />
            </div>
          )}
          <div className="form-group">
            <label className="form-label">E-post</label>
            <input className="rips-input" type="email" value={email} onChange={e => { setEmail(e.target.value); setError(''); }} placeholder="deg@bedrift.no" autoFocus={mode === 'login'} required />
          </div>
          <div className="form-group">
            <label className="form-label">Passord</label>
            <input className="rips-input" type="password" value={password} onChange={e => { setPassword(e.target.value); setError(''); }} placeholder="••••••••" required minLength={6} />
          </div>
          <button className="rips-btn" type="submit" disabled={loading} style={{ width:'100%', justifyContent:'center', height:40, fontSize:14, marginTop:8, opacity: loading ? 0.6 : 1 }}>
            {loading ? 'Venter…' : mode === 'login' ? 'Logg inn' : 'Opprett konto'}
          </button>
        </form>
        <p style={{ fontSize:13, color:'var(--ink-2)', marginTop:20, textAlign:'center' }}>
          {mode === 'login'
            ? <span>Ny bruker? <button className="rips-btn-ghost" style={{ fontSize:13, color:'var(--currant)', padding:0, height:'auto' }} onClick={() => { setMode('signup'); setError(''); setInfo(''); }}>Opprett konto</button></span>
            : <span>Har konto? <button className="rips-btn-ghost" style={{ fontSize:13, color:'var(--currant)', padding:0, height:'auto' }} onClick={() => { setMode('login'); setError(''); setInfo(''); }}>Logg inn</button></span>
          }
        </p>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   RISIKOMATRISE (SVG 5×5)
═══════════════════════════════════════════════════════════════ */

function getRiskTrajectory(risk) {
  const entries = (risk.log || [])
    .filter(e => e.prevP !== undefined)
    .sort((a, b) => a.ts - b.ts);
  if (entries.length === 0) return null;
  const points = [{ p: entries[0].prevP, c: entries[0].prevC }];
  for (const e of entries) points.push({ p: e.newP, c: e.newC });
  return points;
}

function RiskMatrix({ risks, onRiskClick, scale = 5, trajectories = null }) {
  const [hovered, setHovered] = useState(null);
  const n = scale;

  // Fixed grid area; cells shrink as scale grows
  const ML = 66, MR = 16, MT = 16, MB = 54;
  const GRID_W = 400, GRID_H = 290;
  const CW = GRID_W / n;
  const CH = GRID_H / n;
  const W  = ML + GRID_W + MR;
  const H  = MT + GRID_H + MB;
  const dotR = Math.max(5, Math.min(10, CW * 0.22));
  const lblSize = Math.max(8, Math.min(11, 11 * 5 / n));

  const cx = (p) => ML + (p - 1) * CW + CW / 2;
  const cy = (c) => MT + (n - c) * CH + CH / 2;

  const ticks = Array.from({ length: n }, (_, i) => i + 1);

  // Group risks at same cell
  const groups = {};
  risks.forEach(r => {
    const key = `${r.p},${r.c}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(r);
  });

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display:'block', maxWidth: W }}>
      {/* Background cells */}
      {ticks.flatMap(c =>
        ticks.map(p => (
          <rect
            key={`bg-${p}-${c}`}
            x={ML + (p-1)*CW} y={MT + (n-c)*CH}
            width={CW} height={CH}
            fill={ZONE_BG[getSev(p, c, n)]}
            stroke="rgba(255,255,255,0.7)" strokeWidth={1}
          />
        ))
      )}

      {/* Outer border */}
      <rect x={ML} y={MT} width={GRID_W} height={GRID_H} fill="none" stroke="var(--rule-strong)" strokeWidth={1} />

      {/* Trajectory arrows (history mode) */}
      {trajectories && (
        <defs>
          <marker id="rips-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L7,3.5 z" fill="#5C544A" />
          </marker>
        </defs>
      )}
      {trajectories && risks.map(r => {
        const traj = trajectories[r.id];
        if (!traj || traj.length < 2) return null;
        return (
          <g key={`traj-${r.id}`} pointerEvents="none">
            {traj.map((pt, i) => {
              if (i === traj.length - 1) return null;
              const x1 = cx(pt.p), y1 = cy(pt.c);
              const x2 = cx(traj[i+1].p), y2 = cy(traj[i+1].c);
              const dx = x2 - x1, dy = y2 - y1;
              const len = Math.sqrt(dx*dx + dy*dy);
              if (len < 1) return null;
              const shrink = dotR + 3;
              const ux = dx / len, uy = dy / len;
              return (
                <line key={i}
                  x1={x1 + ux * shrink} y1={y1 + uy * shrink}
                  x2={x2 - ux * (shrink + 4)} y2={y2 - uy * (shrink + 4)}
                  stroke="#5C544A" strokeWidth={1.5} strokeDasharray="5,3"
                  markerEnd="url(#rips-arrow)"
                />
              );
            })}
            {traj.slice(0, -1).map((pt, i) => (
              <circle key={`ghost-${i}`}
                cx={cx(pt.p)} cy={cy(pt.c)} r={dotR}
                fill={SEV_DOT[getSev(pt.p, pt.c, n)]} opacity={0.28}
                stroke="white" strokeWidth={1.5}
              />
            ))}
          </g>
        );
      })}

      {/* X-axis tick labels */}
      {ticks.map(p => (
        <text key={`xl-${p}`} x={cx(p)} y={H - MB + 16} textAnchor="middle" fontSize={lblSize} fill="#5C544A" fontFamily="Geist,system-ui">{p}</text>
      ))}
      {/* X-axis sub-labels — only show for scale ≤ 6 to avoid crowding */}
      {n <= 6 && ticks.map(p => (
        <text key={`xs-${p}`} x={cx(p)} y={H - MB + 30} textAnchor="middle" fontSize={Math.max(7, lblSize - 2)} fill="#8A8275" fontFamily="Geist,system-ui">
          {probLabel(p, n).split(' ')[0]}
        </text>
      ))}
      <text x={ML + GRID_W/2} y={H - 4} textAnchor="middle" fontSize={10} fill="#8A8275" fontFamily="Geist,system-ui" letterSpacing="0.06em">
        SANNSYNLIGHET
      </text>

      {/* Y-axis tick labels */}
      {ticks.map(c => (
        <text key={`yl-${c}`} x={ML - 8} y={cy(c) + 4} textAnchor="end" fontSize={lblSize} fill="#5C544A" fontFamily="Geist,system-ui">{c}</text>
      ))}
      <text transform={`translate(13,${MT + GRID_H/2}) rotate(-90)`} textAnchor="middle" fontSize={10} fill="#8A8275" fontFamily="Geist,system-ui" letterSpacing="0.06em">
        KONSEKVENS
      </text>

      {/* Risk dots */}
      {Object.entries(groups).map(([key, grp]) => {
        const [p, c] = key.split(',').map(Number);
        return grp.map((r, idx) => {
          const sev = getSev(r.p, r.c, n);
          const offset = grp.length > 1 ? (idx - (grp.length - 1) / 2) * (dotR * 2 + 2) : 0;
          const dotX = cx(p) + offset;
          const dotY = cy(c);
          const isHov = hovered?.id === r.id;
          return (
            <g key={r.id} style={{ cursor:'pointer' }} onClick={() => onRiskClick(r.id)} onMouseEnter={() => setHovered(r)} onMouseLeave={() => setHovered(null)}>
              <circle cx={dotX} cy={dotY} r={isHov ? dotR + 2 : dotR} fill={SEV_DOT[sev]} stroke="white" strokeWidth={1.5} opacity={hovered && !isHov ? 0.45 : 1} style={{ transition:'r 80ms, opacity 80ms' }} />
            </g>
          );
        });
      })}

      {/* Tooltip */}
      {hovered && (() => {
        const sev = getSev(hovered.p, hovered.c, n);
        const tipW = 206, tipH = 50;
        const rawX = cx(hovered.p) - tipW / 2;
        const rawY = cy(hovered.c) > MT + GRID_H / 2 ? cy(hovered.c) - tipH - 14 : cy(hovered.c) + dotR + 6;
        const tipX = Math.max(ML, Math.min(rawX, W - MR - tipW));
        return (
          <g pointerEvents="none">
            <rect x={tipX} y={rawY} width={tipW} height={tipH} rx={4} fill="var(--ink)" />
            <text x={tipX + 12} y={rawY + 18} fontSize={12} fill="var(--paper)" fontFamily="Geist,system-ui" fontWeight="500">
              {hovered.title.length > 26 ? hovered.title.slice(0,26) + '…' : hovered.title}
            </text>
            <text x={tipX + 12} y={rawY + 35} fontSize={10.5} fill="#8A8275" fontFamily="Geist,system-ui">
              {`S:${hovered.p} · K:${hovered.c} · Score ${hovered.p * hovered.c} · ${SEV_LABEL[sev]}`}
            </text>
          </g>
        );
      })()}
    </svg>
  );
}

function RiskTable({ risks, onOpen, scale = 5 }) {
  return (
    <table className="rips-table">
      <thead>
        <tr>
          <th style={{ width:84 }}>ID</th>
          <th>Tittel</th>
          <th style={{ width:120 }}>Eier</th>
          <th style={{ width:150 }}>Tagger</th>
          <th style={{ width:100, textAlign:'center' }}>Sannsynlighet</th>
          <th style={{ width:100, textAlign:'center' }}>Konsekvens</th>
          <th style={{ width:100 }}>Alvor</th>
          <th style={{ width:80, textAlign:'center' }}>Tiltak</th>
        </tr>
      </thead>
      <tbody>
        {risks.map(r => {
          const sev = getSev(r.p, r.c, scale);
          const done = r.mitigations.filter(m => m.done).length;
          const total = r.mitigations.length;
          const tags = r.tags || (r.category ? [r.category] : []);
          return (
            <tr key={r.id} onClick={() => onOpen(r.id)}>
              <td className="mono accent">{r.id}</td>
              <td><span style={{ fontWeight:500 }}>{r.title}</span></td>
              <td>{r.owner}</td>
              <td>
                <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
                  {tags.map(t => <span key={t} className="tag-pill-sm">{t}</span>)}
                  {tags.length === 0 && <span style={{ color:'var(--ink-3)', fontSize:12 }}>—</span>}
                </div>
              </td>
              <td className="mono" style={{ textAlign:'center' }}>
                {r.p} <span style={{ color:'var(--ink-3)', fontFamily:'var(--font-sans)', fontSize:11 }}>{probLabel(r.p, scale)}</span>
              </td>
              <td className="mono" style={{ textAlign:'center' }}>
                {r.c} <span style={{ color:'var(--ink-3)', fontFamily:'var(--font-sans)', fontSize:11 }}>{consLabel(r.c, scale)}</span>
              </td>
              <td><SevPill sev={sev} /></td>
              <td className="mono" style={{ textAlign:'center', color: total > 0 && done === total ? 'var(--leaf)' : total > 0 ? 'var(--ink-2)' : 'var(--ink-3)' }}>
                {total > 0 ? `${done}/${total}` : '—'}
              </td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

const formatTs = (ts) => {
  const diffMin = Math.round((Date.now() - ts) / 60000);
  if (diffMin < 1)  return 'nettopp';
  if (diffMin < 60) return `${diffMin} min siden`;
  const diffH = Math.round(diffMin / 60);
  if (diffH < 24)   return `${diffH} t siden`;
  return new Date(ts).toLocaleDateString('nb-NO', { day:'numeric', month:'short' });
};

// Top-level so React never unmounts/remounts it (fixes lost-focus on every keystroke)
function CommentThread({ comments = [], onAdd, onDelete, inputValue, onInputChange }) {
  const ref = useRef(null);
  return (
    <div className="comment-thread">
      {comments.map(c => (
        <div key={c.id} className="comment-item">
          <div className="comment-meta">
            <b>{c.user}</b>
            <span className="mono">{formatTs(c.ts)}</span>
            <button className="rips-btn-ghost" style={{ padding:'1px 3px', height:'auto', color:'var(--ink-3)', marginLeft:'auto' }} onClick={() => onDelete(c.id)}>
              <Icon name="x" size={11} />
            </button>
          </div>
          <div className="comment-text">{c.text}</div>
        </div>
      ))}
      <div className="comment-add">
        <textarea
          ref={ref}
          className="rips-input"
          placeholder="Skriv en kommentar… (Enter for å sende)"
          value={inputValue}
          onChange={e => onInputChange(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onAdd(); ref.current?.focus(); } }}
          rows={2}
        />
        <button className="rips-btn rips-small" onClick={() => { onAdd(); ref.current?.focus(); }} style={{ alignSelf:'flex-end' }}>Legg til</button>
      </div>
    </div>
  );
}

function RiskDrawer({ risk, onClose, onUpdate, onDelete, scale = 5, availableTags = [], onCreateTag = () => {}, onDeleteTag = () => {}, user, profiles = [] }) {
  const [addingMit,     setAddingMit]     = useState(false);
  const [mitLabel,      setMitLabel]      = useState('');
  const [mitDue,        setMitDue]        = useState('');
  const [mitOwner,      setMitOwner]      = useState('');
  const [editMitId,     setEditMitId]     = useState(null);
  const [eMitLabel,     setEMitLabel]     = useState('');
  const [eMitOwner,     setEMitOwner]     = useState('');
  const [eMitDue,       setEMitDue]       = useState('');
  const [editing,       setEditing]       = useState(false);
  const [eTitle,        setETitle]        = useState('');
  const [eOwner,        setEOwner]        = useState('');
  const [eTags,         setETags]         = useState([]);
  const [eP,            setEP]            = useState(1);
  const [eC,            setEC]            = useState(1);
  const [eDesc,         setEDesc]         = useState('');
  const [riskCmtText,   setRiskCmtText]   = useState('');
  const [expandedMitIds,setExpandedMitIds]= useState(new Set());
  const [mitCmtTexts,   setMitCmtTexts]   = useState({});

  if (!risk) return null;

  const sev   = getSev(risk.p, risk.c, scale);
  const ticks = Array.from({ length: scale }, (_, i) => i + 1);
  const tags  = risk.tags || (risk.category ? [risk.category] : []);
  const log   = risk.log || [];
  const who   = getUserName(user);

  const startEdit = () => {
    setETitle(risk.title); setEOwner(risk.owner); setETags(tags);
    setEP(risk.p); setEC(risk.c); setEDesc(risk.description || '');
    setEditing(true);
  };

  const saveEdit = () => {
    if (!eTitle.trim() || !eOwner.trim()) return;
    const newLog = [...log];
    const pChanged = eP !== risk.p, cChanged = eC !== risk.c;
    if (pChanged || cChanged) {
      newLog.push({
        id: uid('L'), ts: Date.now(), user: who,
        prevP: risk.p, prevC: risk.c, newP: eP, newC: eC,
        text: [
          pChanged && `Sannsynlighet endret fra ${risk.p} (${probLabel(risk.p, scale)}) til ${eP} (${probLabel(eP, scale)})`,
          cChanged && `Konsekvens endret fra ${risk.c} (${consLabel(risk.c, scale)}) til ${eC} (${consLabel(eC, scale)})`,
        ].filter(Boolean).join('. '),
      });
    }
    if (eTitle.trim() !== risk.title) newLog.push({ id: uid('L'), ts: Date.now(), user: who, text: `Tittel endret.` });
    if (eOwner.trim() !== risk.owner) newLog.push({ id: uid('L'), ts: Date.now(), user: who, text: `Eier endret til ${eOwner.trim()}.` });
    onUpdate({ ...risk, title: eTitle.trim(), owner: eOwner.trim(), tags: eTags, p: eP, c: eC, description: eDesc.trim(), log: newLog });
    setEditing(false);
  };

  const toggleMit       = (id) => onUpdate({ ...risk, mitigations: risk.mitigations.map(m => m.id === id ? { ...m, done: !m.done } : m) });
  const removeMit       = (id) => onUpdate({ ...risk, mitigations: risk.mitigations.filter(m => m.id !== id) });
  const saveMit         = () => {
    if (!mitLabel.trim()) return;
    onUpdate({ ...risk, mitigations: [...risk.mitigations, { id: uid('M'), label: mitLabel.trim(), due: mitDue.trim(), owner: mitOwner.trim(), done: false, comments: [] }] });
    setMitLabel(''); setMitDue(''); setMitOwner(''); setAddingMit(false);
  };

  const toggleMitExpand  = (id) => setExpandedMitIds(prev => { const s = new Set(prev); s.has(id) ? s.delete(id) : s.add(id); return s; });

  const startEditMit = (m) => { setEditMitId(m.id); setEMitLabel(m.label); setEMitOwner(m.owner || ''); setEMitDue(m.due || ''); };
  const saveEditMit  = () => {
    if (!eMitLabel.trim()) return;
    onUpdate({ ...risk, mitigations: risk.mitigations.map(m => m.id === editMitId ? { ...m, label: eMitLabel.trim(), owner: eMitOwner.trim(), due: eMitDue } : m) });
    setEditMitId(null);
  };

  const addRiskComment  = () => {
    if (!riskCmtText.trim()) return;
    onUpdate({ ...risk, comments: [...(risk.comments || []), { id: uid('C'), ts: Date.now(), user: who, text: riskCmtText.trim() }] });
    setRiskCmtText('');
  };
  const delRiskComment  = (cid) => onUpdate({ ...risk, comments: (risk.comments || []).filter(c => c.id !== cid) });

  const addMitComment   = (mid) => {
    const text = (mitCmtTexts[mid] || '').trim();
    if (!text) return;
    onUpdate({ ...risk, mitigations: risk.mitigations.map(m => m.id === mid ? { ...m, comments: [...(m.comments || []), { id: uid('C'), ts: Date.now(), user: who, text }] } : m) });
    setMitCmtTexts(p => ({ ...p, [mid]: '' }));
  };
  const delMitComment   = (mid, cid) => onUpdate({ ...risk, mitigations: risk.mitigations.map(m => m.id === mid ? { ...m, comments: (m.comments || []).filter(c => c.id !== cid) } : m) });

  const doneCount = risk.mitigations.filter(m => m.done).length;

  return (
    <>
      <div className="rips-scrim" onClick={editing ? undefined : onClose}></div>
      <aside className="rips-drawer">
        <header className="rips-drawer-head">
          <div style={{ flex:1, minWidth:0 }}>
            <div className="rips-cap">Risiko · <span className="mono">{risk.id}</span></div>
            {editing
              ? <input className="rips-input" value={eTitle} onChange={e => setETitle(e.target.value)} style={{ marginTop:6, fontWeight:500 }} autoFocus />
              : <h2 className="rips-drawer-title">{risk.title}</h2>
            }
          </div>
          <div style={{ display:'flex', gap:4, flexShrink:0 }}>
            {!editing && <>
              <button className="rips-btn-ghost rips-small" style={{ color:'var(--ink-2)' }} onClick={startEdit} title="Rediger risiko"><Icon name="edit" size={13} /></button>
              <button className="rips-btn-ghost rips-small" style={{ color:'var(--ink-3)' }} onClick={() => { if (confirm(`Slett risiko "${risk.title}"?`)) onDelete(risk.id); }} title="Slett risiko"><Icon name="trash" size={13} /></button>
            </>}
            <button className="rips-btn-ghost" style={{ padding:6 }} onClick={editing ? () => setEditing(false) : onClose} title={editing ? 'Avbryt' : 'Lukk'}><Icon name="x" size={16} /></button>
          </div>
        </header>

        {editing ? (
          <div style={{ padding:'4px 20px 24px', display:'flex', flexDirection:'column', gap:14 }}>
            <div className="form-group">
              <label className="form-label">Eier</label>
              <OwnerSelect value={eOwner} onChange={setEOwner} profiles={profiles} />
            </div>
            <div className="form-group">
              <label className="form-label">Tagger</label>
              <TagInput selected={eTags} onChange={setETags} available={availableTags} onCreateTag={onCreateTag} onDeleteTag={onDeleteTag} />
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12, alignItems:'start' }}>
              <div className="form-group">
                <label className="form-label">Sannsynlighet (1–{scale})</label>
                <select className="rips-input rips-select" value={eP} onChange={e => setEP(Number(e.target.value))}>
                  {ticks.map(v => <option key={v} value={v}>{v} — {probLabel(v, scale)}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Konsekvens (1–{scale})</label>
                <select className="rips-input rips-select" value={eC} onChange={e => setEC(Number(e.target.value))}>
                  {ticks.map(v => <option key={v} value={v}>{v} — {consLabel(v, scale)}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Beregnet alvor</label>
                <div style={{ paddingTop:8 }}><SevPill sev={getSev(eP, eC, scale)} /></div>
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">Beskrivelse</label>
              <textarea className="rips-input" value={eDesc} onChange={e => setEDesc(e.target.value)} rows={4} />
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <button className="rips-btn" onClick={saveEdit}>Lagre endringer</button>
              <button className="rips-btn-secondary" onClick={() => setEditing(false)}>Avbryt</button>
            </div>
          </div>
        ) : (
          <>
            <div className="rips-drawer-grid">
              <div className="rips-field">
                <div className="rips-cap">Alvor</div>
                <SevPill sev={sev} />
              </div>
              <div className="rips-field">
                <div className="rips-cap">Eier</div>
                <div style={{ fontSize:14 }}>{risk.owner}</div>
              </div>
              <div className="rips-field" style={{ gridColumn:'1 / -1' }}>
                <div className="rips-cap" style={{ marginBottom:6 }}>Tagger</div>
                <TagInput selected={tags} onChange={newTags => onUpdate({ ...risk, tags: newTags })} available={availableTags} onCreateTag={onCreateTag} onDeleteTag={onDeleteTag} />
              </div>
              <div className="rips-field">
                <div className="rips-cap">Sannsynlighet</div>
                <div className="mono">{risk.p} — {probLabel(risk.p, scale)}</div>
              </div>
              <div className="rips-field">
                <div className="rips-cap">Konsekvens</div>
                <div className="mono">{risk.c} — {consLabel(risk.c, scale)}</div>
              </div>
              <div className="rips-field">
                <div className="rips-cap">Risikoscore</div>
                <div className="mono" style={{ fontSize:18, fontFamily:'var(--font-display)', letterSpacing:'-0.01em' }}>{risk.p * risk.c}</div>
              </div>
            </div>

            <section className="rips-section">
              <div className="rips-cap" style={{ marginBottom:8 }}>Beskrivelse</div>
              <p className="rips-body">
                {risk.description || <em style={{ color:'var(--ink-3)' }}>Ingen beskrivelse ennå. Legg til kontekst slik at neste eier kan handle uten å spørre.</em>}
              </p>
            </section>

            {/* ── KOMMENTARER PÅ RISIKO ── */}
            <section className="rips-section">
              <div className="rips-cap" style={{ marginBottom:10 }}>
                Kommentarer
                {(risk.comments || []).length > 0 && <span style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--ink-3)', fontWeight:400, textTransform:'none', letterSpacing:0, marginLeft:6 }}>({risk.comments.length})</span>}
              </div>
              <CommentThread
                comments={risk.comments || []}
                onAdd={addRiskComment}
                onDelete={delRiskComment}
                inputValue={riskCmtText}
                onInputChange={setRiskCmtText}
              />
            </section>

            {/* ── TILTAK ── */}
            <section className="rips-section">
              <div className="rips-section-head">
                <div className="rips-cap">
                  Tiltak <span style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--ink-3)', fontWeight:400, textTransform:'none', letterSpacing:0 }}>({doneCount}/{risk.mitigations.length})</span>
                </div>
                {!addingMit && (
                  <button className="rips-btn-secondary rips-small" onClick={() => setAddingMit(true)}>
                    <Icon name="plus" size={12} /> Nytt tiltak
                  </button>
                )}
              </div>

              {addingMit && (
                <div className="mit-add-form">
                  <input className="rips-input" placeholder="Beskriv tiltaket…" value={mitLabel} onChange={e => setMitLabel(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') saveMit(); if (e.key === 'Escape') setAddingMit(false); }} autoFocus />
                  <div style={{ display:'grid', gridTemplateColumns:'1fr auto auto auto', gap:8, marginTop:8, alignItems:'center' }}>
                    <OwnerSelect value={mitOwner} onChange={setMitOwner} profiles={profiles} placeholder="Ansvarlig…" />
                    <input className="rips-input" type="date" value={mitDue} onChange={e => setMitDue(e.target.value)} style={{ width:148 }} />
                    <button className="rips-btn rips-small" onClick={saveMit}>Legg til</button>
                    <button className="rips-btn-ghost rips-small" onClick={() => { setAddingMit(false); setMitLabel(''); setMitDue(''); setMitOwner(''); }}>Avbryt</button>
                  </div>
                </div>
              )}

              <ul className="rips-mitigations">
                {risk.mitigations.length === 0 && !addingMit && (
                  <li style={{ color:'var(--ink-3)', fontStyle:'italic', border:'none', paddingTop:8 }}>Ingen tiltak registrert ennå.</li>
                )}
                {risk.mitigations.map(m => {
                  const cmtCount   = (m.comments || []).length;
                  const isExpanded = expandedMitIds.has(m.id);
                  const isEditing  = editMitId === m.id;
                  return (
                    <li key={m.id} style={{ flexDirection:'column', alignItems:'stretch', gap:0 }}>
                      {isEditing ? (
                        <div style={{ display:'flex', flexDirection:'column', gap:8, padding:'6px 0' }}>
                          <input className="rips-input" value={eMitLabel} onChange={e => setEMitLabel(e.target.value)}
                            onKeyDown={e => { if (e.key === 'Enter') saveEditMit(); if (e.key === 'Escape') setEditMitId(null); }} autoFocus />
                          <div style={{ display:'grid', gridTemplateColumns:'1fr auto auto auto', gap:8, alignItems:'center' }}>
                            <OwnerSelect value={eMitOwner} onChange={setEMitOwner} profiles={profiles} placeholder="Ansvarlig…" />
                            <input className="rips-input" type="date" value={eMitDue} onChange={e => setEMitDue(e.target.value)} style={{ width:148 }} />
                            <button className="rips-btn rips-small" onClick={saveEditMit}>Lagre</button>
                            <button className="rips-btn-ghost rips-small" onClick={() => setEditMitId(null)}>Avbryt</button>
                          </div>
                        </div>
                      ) : (
                        <div style={{ display:'flex', alignItems:'center', gap:8, padding:'2px 0' }}>
                          <span className={`rips-check ${m.done ? 'done' : ''}`} onClick={() => toggleMit(m.id)} title={m.done ? 'Marker som åpen' : 'Marker som fullført'}>
                            {m.done && <Icon name="check" size={10} />}
                          </span>
                          <div style={{ flex:1, minWidth:0 }}>
                            <div className={m.done ? 'done' : ''}>{m.label}</div>
                            {m.owner && <div style={{ fontSize:11, color:'var(--ink-3)', marginTop:1 }}>{m.owner}</div>}
                          </div>
                          {m.due && <span className="rips-due">{formatDate(m.due)}</span>}
                          <button className="rips-btn-ghost" style={{ padding:'2px 4px', height:'auto', color:'var(--ink-2)' }} onClick={() => startEditMit(m)} title="Rediger tiltak">
                            <Icon name="edit" size={11} />
                          </button>
                          <button className="rips-btn-ghost" style={{ padding:'2px 5px', height:'auto', color: cmtCount > 0 ? 'var(--currant)' : 'var(--ink-3)', fontSize:11, display:'flex', alignItems:'center', gap:3 }} onClick={() => toggleMitExpand(m.id)} title="Kommentarer">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            {cmtCount > 0 && <span style={{ fontFamily:'var(--font-mono)' }}>{cmtCount}</span>}
                          </button>
                          <button className="rips-btn-ghost" style={{ padding:'2px 4px', height:'auto', color:'var(--ink-3)' }} onClick={() => removeMit(m.id)}>
                            <Icon name="x" size={12} />
                          </button>
                        </div>
                      )}
                      {isExpanded && !isEditing && (
                        <CommentThread
                          comments={m.comments || []}
                          onAdd={() => addMitComment(m.id)}
                          onDelete={(cid) => delMitComment(m.id, cid)}
                          inputValue={mitCmtTexts[m.id] || ''}
                          onInputChange={val => setMitCmtTexts(p => ({ ...p, [m.id]: val }))}
                        />
                      )}
                    </li>
                  );
                })}
              </ul>
            </section>

            {log.length > 0 && (
              <section className="rips-section">
                <div className="rips-cap" style={{ marginBottom:10 }}>Endringslogg</div>
                <ol className="rips-activity">
                  {[...log].reverse().map(entry => (
                    <li key={entry.id}>
                      <span className="rips-when mono">{formatTs(entry.ts)}</span>
                      <span><b>{entry.user}</b> — {entry.text}</span>
                    </li>
                  ))}
                </ol>
              </section>
            )}
          </>
        )}
      </aside>
    </>
  );
}

function EditCollectionModal({ collection, onClose, onSave, profiles = [] }) {
  const [name,   setName]   = useState(collection.name);
  const [desc,   setDesc]   = useState(collection.description || '');
  const [owner,  setOwner]  = useState(collection.owner);
  const [period, setPeriod] = useState(collection.period || '');
  const [scale,  setScale]  = useState(collection.scale || 5);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!name.trim() || !owner.trim()) return;
    const newScale = Number(scale);
    // Cap existing risk values if scale is reduced
    const risks = collection.risks.map(r => ({
      ...r,
      p: Math.min(r.p, newScale),
      c: Math.min(r.c, newScale),
    }));
    onSave({ ...collection, name: name.trim(), description: desc.trim(), owner: owner.trim(), period: period.trim(), scale: newScale, risks });
    onClose();
  };

  return (
    <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-head">
          <h3 style={{ margin:0, fontWeight:500, fontSize:17 }}>Rediger samling</h3>
          <button className="rips-btn-ghost" style={{ padding:6 }} onClick={onClose}><Icon name="x" size={16} /></button>
        </div>
        <form onSubmit={handleSubmit} style={{ padding:'20px 24px 24px', display:'flex', flexDirection:'column', gap:16 }}>
          <div className="form-group">
            <label className="form-label">Navn *</label>
            <input className="rips-input" value={name} onChange={e => setName(e.target.value)} autoFocus required />
          </div>
          <div className="form-group">
            <label className="form-label">Beskrivelse</label>
            <textarea className="rips-input" value={desc} onChange={e => setDesc(e.target.value)} rows={3} />
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14 }}>
            <div className="form-group">
              <label className="form-label">Eier *</label>
              <OwnerSelect value={owner} onChange={setOwner} profiles={profiles} />
            </div>
            <div className="form-group">
              <label className="form-label">Periode</label>
              <input className="rips-input" value={period} onChange={e => setPeriod(e.target.value)} placeholder="Q3 2026" />
            </div>
            <div className="form-group">
              <label className="form-label">Skala (1–n)</label>
              <select className="rips-input rips-select" value={scale} onChange={e => setScale(Number(e.target.value))}>
                {[2,3,4,5,6,7,8,9,10].map(n => <option key={n} value={n}>{n}×{n}</option>)}

              {Number(scale) < (collection.scale || 5) && (

              )}

  );
}

function DashboardView({ collections, setView, setSelectedCollectionId, onAddCollection }) {
  const totalRisks = collections.reduce((s,c) => s + c.risks.length, 0);
  const highOrCrit = collections.reduce((s,col) => s + col.risks.filter(r => ['high','critical'].includes(getSev(r.p,r.c,col.scale||5))).length, 0);
  const critCount  = collections.reduce((s,col) => s + col.risks.filter(r => getSev(r.p,r.c,col.scale||5) === 'critical').length, 0);
  const openMits   = collections.reduce((s,c) => s + c.risks.reduce((s2,r) => s2 + r.mitigations.filter(m => !m.done).length, 0), 0);

  const kpis = [
    { cap:'Risikosamlinger',    num: collections.length, sub:'totalt i workspace' },
    { cap:'Registrerte risikoer', num: totalRisks,       sub:'på tvers av samlinger' },
    { cap:'Høy eller kritisk',  num: highOrCrit,         sub:`${critCount} kritiske` },
    { cap:'Åpne tiltak',        num: openMits,           sub:'ikke fullført' },
  ];

  return (
    <div className="app-page">
      <header className="page-head">
        <div className="page-title-block">
          <div className="rips-cap">Dashboard · {new Date().getFullYear()}</div>
          <h1 className="page-title">Oversikt, <em>som det står nå</em></h1>
        </div>
        <button className="rips-btn" onClick={onAddCollection}>
          <Icon name="plus" size={14} /> Ny samling
        </button>
      </header>

      <section className="rips-kpis" style={{ marginBottom:28 }}>
        {kpis.map((k,i) => (
          <div key={i} className="rips-kpi">
            <div className="rips-cap">{k.cap}</div>
            <div className="rips-num">{k.num}</div>
            <div className="rips-sub-text">{k.sub}</div>
          </div>
        ))}
      </section>

      <div className="rips-cap" style={{ marginBottom:10 }}>Samlinger</div>
      <div style={{ background:'var(--paper)', border:'1px solid var(--rule)', borderRadius:6, overflow:'hidden' }}>
        {collections.length === 0 ? (
          <div style={{ padding:'40px 24px', textAlign:'center', color:'var(--ink-3)', fontStyle:'italic' }}>
            Ingen risikosamlinger ennå. Gå til Samlinger og opprett den første.
          </div>
        ) : collections.map((col, idx) => {
          const sevs = col.risks.map(r => getSev(r.p,r.c,col.scale||5));
          const worstSev = ['critical','high','medium','low'].find(s => sevs.includes(s));
          const openM = col.risks.reduce((s,r) => s + r.mitigations.filter(m => !m.done).length, 0);
          return (
            <div
              key={col.id}
              style={{ display:'flex', alignItems:'center', padding:'14px 20px', borderBottom: idx < collections.length - 1 ? '1px solid var(--rule)' : 'none', cursor:'pointer', transition:'background 80ms' }}
              onMouseEnter={e => e.currentTarget.style.background='var(--bg-raised)'}
              onMouseLeave={e => e.currentTarget.style.background=''}
              onClick={() => { setSelectedCollectionId(col.id); setView('collection'); }}
            >
              <div style={{ flex:1 }}>
                <div style={{ fontWeight:500, fontSize:14 }}>{col.name}</div>
                <div style={{ fontSize:12, color:'var(--ink-2)', marginTop:2 }}>{col.owner} · {col.period} · {col.risks.length} risikoer</div>
              </div>
              <div style={{ display:'flex', gap:12, alignItems:'center' }}>
                {worstSev && <SevPill sev={worstSev} />}
                {openM > 0 && <span style={{ fontSize:12, color:'var(--amber)', fontFamily:'var(--font-mono)' }}>{openM} åpne tiltak</span>}
                <Icon name="forward" size={14} color="var(--ink-3)" />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

        <header className="page-head">
          <div>
            <button
              className="rips-btn-ghost"
              style={{ display:'inline-flex', alignItems:'center', gap:6, fontSize:13, color:'var(--ink-2)', padding:'4px 8px 4px 4px', marginBottom:10 }}
              onClick={onBack}
            >
              <Icon name="back" size={14} /> Alle samlinger
            </button>
            <div className="page-title-block">
              <div className="rips-cap">{collection.owner}{collection.period ? ` · ${collection.period}` : ''}</div>
              <h1 className="page-title">{collection.name}</h1>
            </div>
          </div>
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <button className="rips-btn-secondary" onClick={() => window.print()} title="Skriv ut / Lagre som PDF">
              <Icon name="printer" size={14} /> Skriv ut
            </button>
            <button className="rips-btn-secondary" onClick={() => setShowEditCol(true)}>
              <Icon name="edit" size={14} /> Rediger
            </button>
            <button className="rips-btn" onClick={() => setShowAddRisk(true)}>
              <Icon name="plus" size={14} /> Ny risiko
            </button>
          </div>
        </header>

        {collection.description && (
          <p style={{ fontSize:14, color:'var(--ink-2)', margin:'0 0 24px', maxWidth:640 }}>{collection.description}</p>
        )}

        {collection.risks.length > 0 && (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 200px', gap:20, marginBottom:28, alignItems:'start' }}>
            {/* Risikomatrise */}
            <div style={{ background:'var(--paper)', border:'1px solid var(--rule)', borderRadius:6, padding:20 }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
                <div className="rips-cap">Risikomatrise — sannsynlighet × konsekvens ({scale}×{scale})</div>
                {hasHistory && (
                  <button
                    className={`rips-btn-ghost rips-small ${showHistory ? 'active' : ''}`}
                    style={{ fontSize:11, color: showHistory ? 'var(--currant)' : 'var(--ink-2)', display:'flex', alignItems:'center', gap:5 }}
                    onClick={() => setShowHistory(h => !h)}
                    title="Vis bevegelse i matrisen basert på endringslogg"
                  >
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    {showHistory ? 'Skjul utvikling' : 'Vis utvikling'}
                  </button>
                )}
              </div>
              <RiskMatrix risks={collection.risks} onRiskClick={id => setOpenRiskId(id)} scale={scale} trajectories={trajectories} />
              <div style={{ display:'flex', gap:20, marginTop:14, flexWrap:'wrap', alignItems:'center' }}>
                {['low','medium','high','critical'].map(s => (
                  <div key={s} style={{ display:'flex', alignItems:'center', gap:6, fontSize:12, color:'var(--ink-2)' }}>
                    <span style={{ width:9, height:9, borderRadius:'50%', background:SEV_DOT[s], display:'inline-block' }}></span>
                    {SEV_LABEL[s]} ({sevCounts[s] || 0})
                  </div>
                ))}
                {showHistory && (
                  <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:12, color:'var(--ink-2)', marginLeft:'auto' }}>
                    <svg width="22" height="10" viewBox="0 0 22 10"><line x1="0" y1="5" x2="16" y2="5" stroke="#5C544A" strokeWidth="1.5" strokeDasharray="4,3"/><path d="M13,1 L13,9 L21,5 z" fill="#5C544A"/><circle cx="0" cy="5" r="4" fill="#5C544A" opacity="0.28"/></svg>
                    Tidligere posisjon → nåværende
                  </div>
                )}
              </div>
            </div>

            {/* Alvor-fordeling */}
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {['critical','high','medium','low'].map(s => (
                <div key={s} style={{ background:'var(--paper)', border:'1px solid var(--rule)', borderRadius:6, padding:'12px 16px' }}>
                  <div className="rips-cap" style={{ marginBottom:4 }}>{SEV_LABEL[s]}</div>
                  <div style={{ fontFamily:'var(--font-display)', fontSize:32, lineHeight:1, letterSpacing:'-0.015em', color:SEV_DOT[s] }}>
                    {sevCounts[s] || 0}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Risikotabell */}
        {collection.risks.length === 0 ? (
          <div style={{ background:'var(--paper)', border:'1px solid var(--rule)', borderRadius:6, padding:'56px 24px', textAlign:'center' }}>
            <div style={{ fontFamily:'var(--font-display)', fontSize:24, color:'var(--ink-2)', marginBottom:12, fontStyle:'italic' }}>Ingen risikoer ennå</div>
            <p style={{ fontSize:14, color:'var(--ink-2)', marginBottom:20 }}>Legg til den første risikoen for å begynne.</p>
            <button className="rips-btn" onClick={() => setShowAddRisk(true)}><Icon name="plus" size={14} /> Legg til risiko</button>
          </div>
        ) : (
          <>
            <div className="table-toolbar">
              <div className="left">
                {['critical','high','medium','low'].map(s => sevCounts[s] ? (
                  <span key={s} className="chip">
                    <span style={{ width:7, height:7, borderRadius:'50%', background:SEV_DOT[s], display:'inline-block' }}></span>
                    {SEV_LABEL[s]}: {sevCounts[s]}
                  </span>
                ) : null)}
              </div>
              <span style={{ color:'var(--ink-2)', fontSize:12, fontFamily:'var(--font-mono)' }}>
                {collection.risks.length} risikoer
              </span>
            </div>
            <RiskTable risks={collection.risks} onOpen={id => setOpenRiskId(id)} scale={scale} />
          </>
        )}
      </div>

      {openRisk && (
        <RiskDrawer
          risk={openRisk}
          onClose={() => setOpenRiskId(null)}
          onUpdate={updated => { onUpdateRisk(updated); }}
          onDelete={id => { onDeleteRisk(id); setOpenRiskId(null); }}
          scale={scale}
          availableTags={availableTags}
          onCreateTag={onCreateTag}
          onDeleteTag={onDeleteTag}
          user={user}
          profiles={profiles}
        />
      )}

      {showAddRisk && (
        <AddRiskModal
          onClose={() => setShowAddRisk(false)}
          onAdd={risk => { onAddRisk(risk); setShowAddRisk(false); }}
          scale={scale}
          availableTags={availableTags}
          onCreateTag={onCreateTag}
          onDeleteTag={onDeleteTag}
          profiles={profiles}
        />
      )}

      {showEditCol && (
        <EditCollectionModal
          collection={collection}
          onClose={() => setShowEditCol(false)}
          onSave={updated => { onUpdateCollection(updated); setShowEditCol(false); }}
          profiles={profiles}
        />
      )}

      {/* ── Print report rendered outside #root so @media print can target it ── */}
      {ReactDOM.createPortal(
      <div className="print-report">
        <div className="print-header">
          <div className="print-logo-row">
            <RipsLogo size={28} bg="var(--paper)" />
            <span className="print-app-name">Rips</span>
          </div>
          <div className="print-meta">
            {collection.owner && <span>{collection.owner}</span>}
            {collection.period && <span>{collection.period}</span>}
            <span>Skala {scale}×{scale}</span>
            <span>{new Date().toLocaleDateString('nb-NO', { day:'numeric', month:'long', year:'numeric' })}</span>
          </div>
        </div>
        <h1 className="print-title">{collection.name}</h1>
        {collection.description && <p className="print-desc">{collection.description}</p>}

        <div className="print-matrix-section">
          <div className="print-section-label">Risikomatrise — sannsynlighet × konsekvens ({scale}×{scale})</div>
          <div className="print-matrix-wrap">
            <RiskMatrix risks={collection.risks} onRiskClick={() => {}} scale={scale} />
          </div>
          <div className="print-legend">
            {['low','medium','high','critical'].map(s => (
              <div key={s} className="print-legend-item">
                <span className="print-dot" style={{ background: SEV_DOT[s] }}></span>
                {SEV_LABEL[s]} ({sevCounts[s] || 0})
              </div>
            ))}
          </div>
        </div>

        <div className="print-section-label" style={{ marginTop:28, marginBottom:10 }}>Risikoregister</div>
        <table className="print-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tittel</th>
              <th>Eier</th>
              <th>S</th>
              <th>K</th>
              <th>Alvor</th>
              <th>Tiltak</th>
            </tr>
          </thead>
          <tbody>
            {collection.risks.map(r => {
              const sev = getSev(r.p, r.c, scale);
              const done = r.mitigations.filter(m => m.done).length;
              return (
                <tr key={r.id}>
                  <td className="print-mono">{r.id}</td>
                  <td>{r.title}</td>
                  <td>{r.owner || '—'}</td>
                  <td className="print-mono print-center">{r.p}</td>
                  <td className="print-mono print-center">{r.c}</td>
                  <td><span className="print-sev" style={{ background: SEV_BG_PRINT[sev], color: SEV_FG_PRINT[sev] }}>{SEV_LABEL[sev]}</span></td>
                  <td className="print-mono print-center">{r.mitigations.length > 0 ? `${done}/${r.mitigations.length}` : '—'}</td>
                </tr>
              );
            })}
          </tbody>
        </table>

        {collection.risks.some(r => r.mitigations.length > 0) && (
          <>
            <div className="print-section-label" style={{ marginTop:28, marginBottom:10 }}>Tiltak</div>
            {collection.risks.filter(r => r.mitigations.length > 0).map(r => (
              <div key={r.id} className="print-mit-group">
                <div className="print-mit-risk">{r.id} — {r.title}</div>
                {r.mitigations.map(m => (
                  <div key={m.id} className="print-mit-row">
                    <span className={`print-check ${m.done ? 'done' : ''}`}>{m.done ? '✓' : '○'}</span>
                    <span className="print-mit-label">{m.label}</span>
                    {m.owner && <span className="print-mit-meta">{m.owner}</span>}
                    {m.due   && <span className="print-mit-meta">{formatDate(m.due)}</span>}
                  </div>
                ))}
              </div>
            ))}
          </>
        )}

        <div className="print-footer">
          Generert fra Rips · {new Date().toLocaleString('nb-NO')}
        </div>
      </div>
      , document.getElementById('print-root')
      )}
    </>
  );
}

/* ═══════════════════════════════════════════════════════════════
   BRUKERPROFIL
═══════════════════════════════════════════════════════════════ */

function ProfileView({ user, collections }) {
  const totalRisks = collections.reduce((s, c) => s + c.risks.length, 0);
  const totalMits  = collections.reduce((s, c) => s + c.risks.reduce((s2, r) => s2 + r.mitigations.length, 0), 0);
  const displayName = getUserName(user);
  const initials    = (n) => (n || 'B').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

  return (
    <div className="app-page">
      <header className="page-head">
        <div className="page-title-block">
          <div className="rips-cap">Konto</div>
          <h1 className="page-title">Brukerprofil</h1>
        </div>
      </header>

      <div style={{ display:'grid', gridTemplateColumns:'280px 1fr', gap:24, alignItems:'start' }}>
        {/* Profilkort */}
        <div style={{ background:'var(--paper)', border:'1px solid var(--rule)', borderRadius:8, padding:28, display:'flex', flexDirection:'column', alignItems:'center', gap:16 }}>
          <div style={{ width:72, height:72, borderRadius:'50%', background:'var(--leaf)', color:'var(--leaf-skin)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:26, fontWeight:600, letterSpacing:'-0.01em' }}>
            {initials(displayName)}
          </div>
          <div style={{ textAlign:'center' }}>
            <div style={{ fontWeight:500, fontSize:17 }}>{displayName}</div>
            <div style={{ fontSize:13, color:'var(--ink-2)', marginTop:4 }}>{user?.email}</div>
          </div>
        </div>

        {/* Stats + innstillinger */}
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <div style={{ background:'var(--paper)', border:'1px solid var(--rule)', borderRadius:8, padding:'20px 24px' }}>
            <div className="rips-cap" style={{ marginBottom:16 }}>Aktivitet i workspace</div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:16 }}>
              {[
                { cap:'Samlinger', val: collections.length },
                { cap:'Risikoer', val: totalRisks },
                { cap:'Tiltak', val: totalMits },
              ].map(k => (
                <div key={k.cap}>
                  <div style={{ fontSize:11, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:500 }}>{k.cap}</div>
                  <div style={{ fontFamily:'var(--font-display)', fontSize:36, lineHeight:1.1, letterSpacing:'-0.015em', marginTop:4 }}>{k.val}</div>
                </div>
              ))}
            </div>
          </div>

          <div style={{ background:'var(--paper)', border:'1px solid var(--rule)', borderRadius:8, padding:'20px 24px' }}>
            <div className="rips-cap" style={{ marginBottom:12 }}>Eksport</div>
            <p style={{ fontSize:13, color:'var(--ink-2)', margin:'0 0 16px' }}>
              Last ned en sikkerhetskopi av alle samlinger og risikoer som JSON.
            </p>
            <button
              className="rips-btn-secondary"
              onClick={() => {
                const json = JSON.stringify({ collections, exportedAt: new Date().toISOString() }, null, 2);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([json], { type:'application/json' }));
                a.download = `rips-backup-${new Date().toISOString().slice(0,10)}.json`;
                a.click();
              }}
            >
              Eksporter JSON
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   APP SHELL (autentisert)
═══════════════════════════════════════════════════════════════ */

function AppShell({ user, onLogout }) {
  const [view,          setViewRaw]      = useState('dashboard');
  const [collections,   setCollections]  = useState(INITIAL_COLLECTIONS);
  const [selectedId,    setSelectedId]   = useState(null);
  const [showAddCol,    setShowAddCol]   = useState(false);
  const [availableTags, setAvailableTags] = useState(INITIAL_TAGS);
  const [dbReady,       setDbReady]      = useState(false);
  const [profiles,      setProfiles]     = useState([]);

  // Load workspace from Supabase on mount
  useEffect(() => {
    db.from('workspaces').select('*').eq('id', user.id).single().then(({ data, error }) => {
      if (error && error.code !== 'PGRST116') console.error('Rips load error:', error);
      if (data) {
        if (Array.isArray(data.collections)) setCollections(data.collections);
        if (Array.isArray(data.tags) && data.tags.length) setAvailableTags(data.tags);
      }
      setDbReady(true);
    });
    db.from('profiles').select('*').then(({ data }) => { if (data) setProfiles(data); });
  }, []);

  // Debounced save to Supabase (800 ms after last change, only after initial load)
  useEffect(() => {
    if (!dbReady) return;
    const t = setTimeout(() => {
      db.from('workspaces')
        .upsert({ id: user.id, collections, tags: availableTags, updated_at: new Date().toISOString() })
        .then(({ error }) => { if (error) console.error('Rips save error:', error); });
    }, 800);
    return () => clearTimeout(t);
  }, [collections, availableTags, dbReady]);

  const createTag = (name) => setAvailableTags(prev => prev.includes(name) ? prev : [...prev, name]);
  const deleteTag = (name) => setAvailableTags(prev => prev.filter(t => t !== name));


  const setView = (v) => {
    setViewRaw(v);
    if (v !== 'collection') setSelectedId(null);
  };

  const selectedCollection = collections.find(c => c.id === selectedId);

  const crumbs =
    view === 'dashboard'   ? ['Workspace', 'Oversikt'] :
    view === 'collections' ? ['Workspace', 'Samlinger'] :
    view === 'profile'     ? ['Konto', 'Brukerprofil'] :
    ['Workspace', 'Samlinger', selectedCollection?.name || '…'];

  const addCollection = (col) => setCollections(prev => [...prev, col]);
  const deleteCollection = (id) => {
    setCollections(prev => prev.filter(c => c.id !== id));
    if (selectedId === id) setView('collections');
  };

  const addRisk = (risk) => {
    setCollections(prev => prev.map(c => c.id === selectedId ? { ...c, risks: [...c.risks, risk] } : c));
  };
  const updateRisk = (updated) => {
    setCollections(prev => prev.map(c => c.id === selectedId ? { ...c, risks: c.risks.map(r => r.id === updated.id ? updated : r) } : c));
  };
  const deleteRisk = (riskId) => {
    setCollections(prev => prev.map(c => c.id === selectedId ? { ...c, risks: c.risks.filter(r => r.id !== riskId) } : c));
  };
  const updateCollection = (updated) => {
    setCollections(prev => prev.map(col => col.id === updated.id ? updated : col));
  };

  return (
    <div className="app-shell">
      <Sidebar
        view={view}
        setView={setView}
        collections={collections}
        user={user}
        onLogout={onLogout}
      />
      <main className="app-main">
        <TopBar crumbs={crumbs} user={user} />

        {view === 'dashboard' && (
          <DashboardView
            collections={collections}
            setView={setViewRaw}
            setSelectedCollectionId={setSelectedId}
            onAddCollection={() => setShowAddCol(true)}
          />
        )}
        {view === 'collections' && (
          <CollectionsView
            collections={collections}
            onSelect={id => { setSelectedId(id); setViewRaw('collection'); }}
            onAdd={() => setShowAddCol(true)}
            onDelete={deleteCollection}
          />
        )}
        {view === 'collection' && selectedCollection && (
          <CollectionView
            collection={selectedCollection}
            onBack={() => setView('collections')}
            onAddRisk={addRisk}
            onUpdateRisk={updateRisk}
            onDeleteRisk={deleteRisk}
            onUpdateCollection={updateCollection}
            availableTags={availableTags}
            onCreateTag={createTag}
            onDeleteTag={deleteTag}
            user={user}
            profiles={profiles}
          />
        )}
        {view === 'profile' && (
          <ProfileView user={user} collections={collections} />
        )}
      </main>

      {showAddCol && (
        <AddCollectionModal
          onClose={() => setShowAddCol(false)}
          onAdd={col => { addCollection(col); setShowAddCol(false); }}
          profiles={profiles}
        />
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   APP ROT
═══════════════════════════════════════════════════════════════ */

function App() {
  const [screen, setScreen] = useState('loading');
  const [user,   setUser]   = useState(null);

  useEffect(() => {
    // Check for existing session (page reload, tab restore)
    db.auth.getSession().then(({ data: { session } }) => {
      if (session) { setUser(session.user); setScreen('app'); }
      else           setScreen('welcome');
    });
    // Auth state changes (login / logout / token refresh)
    const { data: { subscription } } = db.auth.onAuthStateChange((_event, session) => {
      if (session) { setUser(session.user); setScreen('app'); }
      else          { setUser(null); setScreen('welcome'); }
    });
    return () => subscription.unsubscribe();
  }, []);

  const handleLogout = async () => { await db.auth.signOut(); };

  if (screen === 'loading') return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh', background:'var(--paper)', flexDirection:'column', gap:16 }}>
      <RipsLogo size={42} bg="var(--paper)" />
      <div style={{ fontSize:13, color:'var(--ink-3)' }}>Laster…</div>
    </div>
  );
  if (screen === 'welcome') return <WelcomePage onLogin={() => setScreen('login')} />;
  if (screen === 'login')   return <LoginPage onBack={() => setScreen('welcome')} />;
  return <AppShell user={user} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
